# Rule of the Third Order of the Society of Saint Pius X
# Normative edition: promulgated 1 November 1980 by Abp. Marcel Lefebvre.
# Source: "Sursum Corda", Third Order of the SSPX (US District), No. 4, Winter 2013.
# Reference edition: Third Order Handbook, (c) 2024, Christ the King Priory, Langley BC.
# See docs/RULE-EDITIONS.md and docs/SOURCES.md.
#
# WHAT THIS FILE IS: our structured interpretation of the Rule — what binds, how often,
# on which days, and for whom. Item titles are our own plain descriptions, NOT the Rule's
# wording. The Rule's own text is deliberately not reproduced here; `text:` fields stay
# empty and the user supplies their own copy. The examination-of-conscience prompts are
# carried verbatim by decision of the project owner (see docs/SOURCES.md).

id: sspx-third-order
tradition: sspx-third-order
title: Rule of the Third Order of the Society of Saint Pius X
authority: "+Marcel Lefebvre, November 1, 1980"
bindingUnderSin: false      # rubric on the Rule screen; the Founder's intent was explicitly light
minimumAge: 12

edition:
  id: us-1980
  label: 1980 promulgation, US District (Sursum Corda no. 4, Winter 2013)
  normative: true
  source: https://dickinson.tx.sspx.org/sites/default/files/documents/4-Third%20Order%20Newsletter_Christmas%202013_No4_0.pdf

formation:
  - id: enrollment
    label: Enrollment
    requires: [Request to the district Third Order priest, Information sheet, Enrollment document]
  - id: postulancy
    label: Postulancy
    durationMonths: 12
    requires: [Fidelity in keeping the obligations, Adherence to the spirit of the Third Order]
    concludesWith: Profession — the medal of St. Pius X, a crucifix, and a certificate of membership
  - id: professed
    label: Professed member

items:

  # ---------- Daily ----------
  - id: morning-prayer
    title: Morning prayers
    kind: obligation
    cadence: { every: day }
    when: { sun: sunrise }
    satisfiedByAny: [prime, retreat-book-morning]
    examenQuestion: Have I been faithful to my morning and evening prayers? Or have I neglected them without reason?

  - id: evening-prayer
    title: Evening prayers
    kind: obligation
    cadence: { every: day }
    when: { sun: dusk }
    satisfiedByAny: [compline, retreat-book-evening]
    examenQuestion: Have I been faithful to my morning and evening prayers? Or have I neglected them without reason?

  - id: prime
    title: "Prime — the morning prayer of the Church"
    kind: counsel        # a form that satisfies morning-prayer; the Founder encourages it
    cadence: { every: day }
    prayerId: prime
    note: The Rule names the Office as the preferred form of morning and evening prayer.

  - id: compline
    title: "Compline — the evening prayer of the Church"
    kind: counsel
    cadence: { every: day }
    prayerId: compline

  - id: retreat-book-morning
    title: Morning prayers from the Retreat Book
    kind: counsel
    cadence: { every: day }

  - id: retreat-book-evening
    title: Evening prayers from the Retreat Book
    kind: counsel
    cadence: { every: day }

  - id: rosary
    title: The Rosary
    kind: obligation
    cadence: { every: day }
    examenQuestion: Have I recited my Rosary devoutly, meditating on the Mysteries?

  - id: mass-or-meditation
    title: Mass if possible; otherwise fifteen minutes of meditation
    kind: obligation
    cadence: { every: day }
    satisfiedByAny: [daily-mass, meditation]
    examenQuestion: Have I attended the Traditional Mass when possible? If not, have I daily practiced mental prayer?

  - id: daily-mass
    title: Attendance at the Immemorial Mass
    kind: counsel
    cadence: { every: day }

  - id: meditation
    title: Fifteen minutes of meditation
    kind: counsel
    cadence: { every: day }
    durationMin: 15
    # Note: YOUR edition says "meditation" (mental prayer). The 2024 CA edition broadens
    # this to "a quarter hour of prayer". We follow yours. docs/RULE-EDITIONS.md

  # ---------- Weekly ----------
  - id: sunday-mass
    title: Sunday Mass in the traditional rite
    kind: obligation
    cadence: { every: week }
    onlyIf: [day:sunday]
    examenQuestion: On Sunday, have I made a special effort to assist at Holy Mass? Do I attend the True Mass when on vacation?

  # ---------- Fortnightly / monthly ----------
  - id: penance
    title: Confession
    kind: obligation
    cadence: { every: weeks, n: 2, fallback: { every: month } }
    examenQuestion: Have I been faithful in receiving the Sacrament of Penance with devotion at least once a month? Or have I made peace with my sins and imperfections?

  # ---------- Biennial ----------
  - id: retreat
    title: Retreat
    kind: obligation
    cadence: { every: years, n: 2 }
    examenQuestion: Have I thought seriously of making a retreat? Or have I neglected even to examine the possibility, claiming that it is too far, too costly, etc.?

  # ---------- Fast and abstinence ----------
  - id: fast
    title: Fasting
    kind: obligation
    cadence:
      onDays: [day:ember-wednesday, day:ember-friday, day:ember-saturday,
           day:ash-wednesday, day:holy-saturday,
           day:vigil-of:christmas,      # 24 December
           day:vigil-of:pentecost,
           day:vigil-of:assumption,     # 14 August
           day:vigil-of:all-saints]     # 31 October
    # RESOLVED 2026-09-27: user keeps ALL vigils. Under the 1962 calendar the fasting
    # vigils are these four (per 1917 CIC c.1252 §2) — the 2024 CA edition names only
    # three, omitting the Assumption. The vigil of the Immaculate Conception (7 Dec) was
    # suppressed in the 1955/1962 reforms and survives in the CA edition for priests only;
    # it is available as the opt-in `fast-immaculate-conception-vigil` below.
    # CONFIRM the four-vigil list with the chaplain.
    examenQuestion: Have I kept the fasts of the Third Order — Vigils, Ember Days etc.? Or have I forgotten these days through negligence?

  - id: fast-immaculate-conception-vigil
    title: Fast on 7 December, the old vigil of the Immaculate Conception
    kind: counsel
    cadence: { onDays: [day:vigil-of:immaculate-conception] }
    fromEdition: ca-2024
    note: A pre-1955 vigil, not in the 1962 calendar. Kept by Society priests. Opt-in.

  - id: abstinence
    title: Abstinence
    kind: obligation
    cadence: { onDays: [day:friday] }     # all Fridays, year-round
    examenQuestion: Abstinence on Fridays? Or have I forgotten these days through negligence?

  - id: fast-priests
    title: Lenten Fridays and 7 December
    kind: obligation
    appliesTo: [priest]
    # "all Fridays in Lent" is a conjunction; a flat list would wrongly match every
    # Friday of the year and the whole of Lent. Nesting is why Pred exists.
    cadence:
      onDays:
        - all: [season:lent, day:friday]
        - day:vigil-of:immaculate-conception
    fromEdition: ca-2024               # not in the 1980 text; priests only

  # ---------- Standing dispositions ----------
  - id: no-television
    title: Abstain from television
    kind: obligation
    cadence: { ongoing: true }
    examenQuestion: Have I abstained completely from Television? Or have I made exceptions to the rule?

  - id: no-unclean-reading
    title: Abstain from unclean reading
    kind: obligation
    cadence: { ongoing: true }
    examenQuestion: Have I avoided unclean reading?

  - id: sobriety
    title: Practice sobriety
    kind: obligation
    cadence: { ongoing: true }
    examenQuestion: Have I practiced sobriety?

  - id: mortify-media
    title: Mortify use of the internet and electronic media
    kind: counsel
    cadence: { ongoing: true }
    fromEdition: ca-2024               # opt-in: the 2024 edition's update, not in yours
    examenQuestion: Did I mortify myself in my use of the internet, electronic devices and media?

  # ---------- Reading ----------
  - id: spiritual-reading
    title: Recommended reading
    kind: counsel
    cadence: { ongoing: true }
    note: >
      The Rule names five sources: the acts of its patron, the Tridentine catechism,
      the New Testament, the Imitation, and lives of the saints — and asks that good
      reading be passed on to others, not merely consumed.
    examenQuestion: Have I been faithful to study and spiritual reading? Have I been apostolic, i.e. tried to spread good reading material?

  # ---------- The married ----------
  - id: marriage-laws
    title: Keep the Church's teaching on marriage and openness to a large family
    kind: obligation
    appliesTo: [married]
    cadence: { ongoing: true }

  - id: family-evening-prayers
    title: Family evening prayers, with the Rosary where possible
    kind: obligation
    appliesTo: [married]
    cadence: { every: day }
    when: { sun: dusk }
    note: The Rule frames the home itself as a consecrated place, not just a venue for prayers.

  - id: sunday-liturgical-life
    title: Keep Sundays and feasts centred on the liturgy
    kind: obligation
    appliesTo: [married]
    cadence: { onDays: [day:sunday, rank:<=2] }

  - id: traditional-schools
    title: Choose and support traditional Catholic schools
    kind: obligation
    appliesTo: [parent]
    cadence: { ongoing: true }

  - id: prudent-leisure
    title: Choose leisure and holidays prudently
    kind: obligation
    appliesTo: [married]
    cadence: { ongoing: true }

  # ---------- Professional and social ----------
  - id: justice-charity
    title: Justice and charity in work, as employer or employee
    kind: obligation
    cadence: { ongoing: true }

  - id: social-reign
    title: Work for the social reign of Christ
    kind: obligation
    cadence: { ongoing: true }

# State of life is a profile toggle, not a fork of the Rule. `appliesTo` on each item is
# evaluated against the user's profile, so one Rule file serves a married layman, a single
# layman, and a priest. Current user: married. See docs/PROFILE.md.
profileRequires: [maritalState, hasChildren, isPriest]

community:
  - id: chapter-meeting
    title: District meetings
    cadence: { every: month }
    kind: counsel
